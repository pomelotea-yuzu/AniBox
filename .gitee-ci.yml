# 旧版 Gitee 流水线格式 —— 仅为兼容保留。
# 权威版本已迁到 .workflow/ci.yml（Gitee Go），两者跑同一条门禁链。
# 一旦 .workflow/ci.yml 在 Gitee 上验证通过，删除本文件；在此之前只更新路径、不新增检查。
image: node:22

stages:
  - check
  - test

cache:
  paths:
    - apps/desktop/node_modules/

install_job:
  stage: check
  commands:
    - cd apps/desktop && npm ci --ignore-scripts

typecheck_job:
  stage: check
  commands:
    - cd apps/desktop && npm run typecheck

gates_job:
  stage: check
  commands:
    - node scripts/check-repo.mjs --all

# lint / test 暂不进门禁：存量错误与本机未跑通，见 docs/knowledge/debt.md
