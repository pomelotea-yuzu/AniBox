image: node:22

stages:
  - install
  - check
  - test

cache:
  paths:
    - node_modules/

install_job:
  stage: install
  script:
    - npm ci --ignore-scripts

typecheck_job:
  stage: check
  script:
    - npm run typecheck

lint_job:
  stage: check
  script:
    - npm run lint
  allow_failure: true

test_job:
  stage: test
  script:
    - npm test
