<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniBox</title>
    <style>
      /* Splash Screen — React 挂载前的启动动画 */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f5f0e8;
        transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      /* Logo 呼吸动画 */
      .splash-logo {
        animation: splashBreathe 2.4s ease-in-out infinite;
      }
      @keyframes splashBreathe {
        0%,
        100% {
          opacity: 0.5;
          transform: scale(0.96);
        }
        50% {
          opacity: 1;
          transform: scale(1.02);
        }
      }

      /* 进度点动画 */
      .splash-dots {
        display: flex;
        gap: 6px;
        margin-top: 20px;
      }
      .splash-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #9caf88;
        animation: dotPulse 1.4s ease-in-out infinite;
      }
      .splash-dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .splash-dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes dotPulse {
        0%,
        80%,
        100% {
          transform: scale(0.6);
          opacity: 0.3;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <!-- 启动 Splash -->
    <div id="splash">
      <!-- AniBox Logo SVG -->
      <div class="splash-logo">
        <svg
          width="64"
          height="64"
          viewBox="0 0 64 64"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <!-- 外框 -->
          <rect
            x="8"
            y="12"
            width="48"
            height="40"
            rx="6"
            stroke="#9CAF88"
            stroke-width="2.5"
            fill="none"
          />
          <!-- 屏幕光泽 -->
          <rect x="12" y="16" width="40" height="28" rx="2" fill="#9CAF88" opacity="0.12" />
          <!-- 播放三角 -->
          <polygon points="26,24 26,40 42,32" fill="#9CAF88" opacity="0.85" />
        </svg>
      </div>
      <!-- 标题 -->
      <div
        style="
          margin-top: 16px;
          font-size: 22px;
          font-weight: 600;
          color: #9caf88;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          letter-spacing: 0.08em;
          user-select: none;
        "
      >
        AniBox
      </div>
      <!-- 加载进度点 -->
      <div class="splash-dots">
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
