<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F5F0E8">
<title>AniBox 串流</title>
<style>
/* ============================================================
   莫兰迪六套主题（与主应用 renderer/themes.ts 完全一致）
   由服务端注入当前主题名，网页可自行切换
   ============================================================ */
:root{
  --bg:#F5F0E8; --surface:#EBE5D9; --surface2:#DDD6CB; --border:#DDD6CB;
  --text:#3D3A35; --muted:#8B8579; --accent:#9CAF88; --accent-hover:#859972;
  --accent2:#8EACBF; --overlay:#1a1a1a;
  --ok:#5f9e6e; --warn:#c08a4e; --err:#c05c5c;
  --on-accent:#1f241c; /* 强调色上的文字（深色） */
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}
#app{max-width:820px;margin:0 auto;min-height:100%}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
img{display:block}
.hidden{display:none!important}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb,#c5bfb3);border-radius:2px}

/* ---------- header ---------- */
.hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:12px 14px;
  background:var(--bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.hd .back{font-size:22px;color:var(--muted);padding:2px 6px;line-height:1}
.hd .ttl{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .sub{font-size:11px;color:var(--muted)}
.search{flex:1;display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:6px 10px;color:var(--muted);min-width:0}
.search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13px;margin-left:6px;min-width:0}
.search input::placeholder{color:var(--muted)}

/* 主题切换按钮 + 面板 */
.theme-btn{width:28px;height:28px;border-radius:50%;flex-shrink:0;border:2px solid var(--border);
  background:linear-gradient(135deg,var(--accent) 50%,var(--accent2) 50%);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.theme-panel{position:fixed;top:56px;right:10px;z-index:70;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:10px;width:216px}
.theme-panel .tp-t{font-size:11px;color:var(--muted);padding:0 4px 6px}
.theme-opt{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border-radius:8px;text-align:left}
.theme-opt:active{background:var(--surface2)}
.theme-opt.active{outline:1.5px solid var(--accent)}
.theme-opt .sw{display:flex;width:34px;height:18px;border-radius:5px;overflow:hidden;flex-shrink:0;border:1px solid rgba(0,0,0,.12)}
.theme-opt .sw i{flex:1}
.theme-opt .nm{font-size:11.5px;color:var(--text);flex:1}
.theme-opt .ck{font-size:11px;color:var(--accent);font-weight:700}

/* ---------- 首页 tabs + grid ---------- */
.tabs{display:flex;gap:6px;padding:10px 14px 0}
.tab{padding:6px 14px;border-radius:16px;font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--border)}
.tab.on{color:var(--on-accent);background:var(--accent);border-color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px;padding:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .12s}
.card:active{transform:scale(.97)}
.card .cov{position:relative;aspect-ratio:3/4;background:var(--surface2)}
.card .cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .cov .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--muted)}
.card .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.12)}
.card .prog i{display:block;height:100%;background:var(--accent)}
.card .info{padding:8px 9px}
.card .name{font-size:12.5px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.card .meta{font-size:10.5px;color:var(--muted);margin-top:4px;display:flex;gap:6px;align-items:center}
.card .meta .tag{padding:1px 5px;border-radius:4px;background:var(--surface2);border:1px solid var(--border)}

/* ---------- 详情 ---------- */
.hero{display:flex;gap:14px;padding:14px;background:var(--surface);border-bottom:1px solid var(--border)}
.hero .cov{width:96px;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:var(--surface2);flex-shrink:0}
.hero .cov img{width:100%;height:100%;object-fit:cover}
.hero .info{flex:1;min-width:0}
.hero .t{font-size:16px;font-weight:600;margin-bottom:4px}
.hero .d{font-size:11px;color:var(--muted);line-height:1.6}
.hero .d b{color:var(--text);font-weight:500}
.ep-list{padding:8px 14px 20px}
.ep{display:flex;align-items:center;gap:10px;padding:11px 6px;border-bottom:1px solid var(--border);cursor:pointer}
.ep:active{background:var(--surface)}
.ep .no{width:34px;height:34px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted);flex-shrink:0}
.ep .nm{flex:1;font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep .st{font-size:10.5px;color:var(--muted);flex-shrink:0}
.ep .st.w{color:var(--ok)}
.ep .play{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ep .play svg{width:13px;height:13px}

/* ---------- 文件夹浏览 ---------- */
.crumb{padding:10px 14px 2px;font-size:11px;color:var(--muted);word-break:break-all}
.fdir{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.fdir:active{background:var(--surface)}
.fdir .ic{font-size:15px;width:22px;text-align:center;flex-shrink:0}
.fdir .nm{flex:1;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fdir .sub{font-size:10.5px;color:var(--muted);flex-shrink:0;font-variant-numeric:tabular-nums}
.fdir.up{color:var(--accent)}
.btn-add{display:flex;align-items:center;gap:5px;background:var(--accent);color:var(--on-accent);
  font-size:12px;font-weight:600;padding:7px 12px;border-radius:16px;flex-shrink:0}
.btn-add:active{background:var(--accent-hover)}

/* ---------- 播放器（始终深色控制层，与主应用一致） ---------- */
.player-wrap{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
video{flex:1;width:100%;object-fit:contain;background:#000}
.pbar{position:relative;background:rgba(10,12,16,.9);color:#e8ebf0;padding-bottom:env(safe-area-inset-bottom)}
.seek-row{display:flex;align-items:center;gap:8px;padding:7px 12px 2px}
.seek-row .t{font-size:11px;color:rgba(255,255,255,.72);min-width:42px;font-variant-numeric:tabular-nums;text-align:center}
.seek-row input[type=range]{flex:1;height:22px;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;touch-action:none}
.seek-row input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(255,255,255,.22)}
.seek-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:15px;height:15px;margin-top:-5.5px;border-radius:50%;
  background:var(--accent);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.btn-row{display:flex;align-items:center;gap:2px;padding:4px 8px 8px;flex-wrap:nowrap}
.btn-row button{color:rgba(255,255,255,.92);font-size:14px;padding:7px 9px;border-radius:8px;flex-shrink:0}
.btn-row button:active{background:rgba(255,255,255,.16)}
.btn-row button.on{color:var(--accent)}
.btn-row .speed{font-size:11px;font-weight:700;min-width:38px;padding:7px 4px}
.btn-row .pbtn{font-size:20px;padding:4px 10px}
.btn-row .lbl{font-size:11.5px;font-weight:600;padding:7px 6px;color:rgba(255,255,255,.9)}
.btn-row .lbl.on{color:var(--accent)}
.btn-row input[type=range].vol{width:56px;-webkit-appearance:none;appearance:none;background:transparent;height:22px;cursor:pointer;flex-shrink:1;min-width:34px;touch-action:none}
.btn-row input[type=range].vol::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:rgba(255,255,255,.25)}
.btn-row input[type=range].vol::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:11px;height:11px;margin-top:-4px;border-radius:50%;background:var(--accent);border:1px solid #fff}
.btn-row .grow{flex:1}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:rgba(0,0,0,.72);color:#e8ebf0;z-index:5}
.tap-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:6;
  background:rgba(0,0,0,.55);color:#fff;font-size:20px;font-weight:600;letter-spacing:2px;cursor:pointer}
.pl-back{position:absolute;top:10px;left:10px;z-index:8;display:flex;align-items:center;gap:3px;
  background:rgba(0,0,0,.45);color:#fff;font-size:13px;padding:6px 12px;border-radius:18px;backdrop-filter:blur(4px)}
.pl-back:active{background:rgba(0,0,0,.7)}
.dbg{position:absolute;bottom:112px;left:0;right:0;z-index:7;background:rgba(0,0,0,.6);
  color:#9fe1cb;font-size:10px;font-family:monospace;padding:3px 8px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.ov .ring{width:34px;height:34px;border:3px solid rgba(255,255,255,.18);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ov .pt{font-size:13px}
.ov .pd{font-size:11px;color:rgba(255,255,255,.65)}
.ov .err{font-size:13px;color:#ff9d9d;text-align:center;padding:0 30px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:rgba(0,0,0,.85);
  color:#fff;font-size:12.5px;padding:8px 14px;border-radius:20px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80%}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   六套莫兰迪主题（与主应用 renderer/src/themes.ts 保持一致）
   ============================================================ */
const THEMES = {
  'warm-oat':       { label:'暖燕麦',   bg:'#F5F0E8', surface:'#EBE5D9', accent:'#9CAF88', accentHover:'#859972', secondary:'#8EACBF', secondaryHover:'#7B9BB0', text:'#3D3A35', textMuted:'#8B8579', border:'#DDD6CB', overlay:'#1a1a1a', scrollThumb:'#C5BFB3', scrollHover:'#A8A093' },
  'cool-linen':     { label:'冷亚麻',   bg:'#F0F2F4', surface:'#E4E8EC', accent:'#8EACBF', accentHover:'#7B9BB0', secondary:'#9CAF88', secondaryHover:'#859972', text:'#3A3D40', textMuted:'#8E9398', border:'#D5DAE0', overlay:'#1a1a1a', scrollThumb:'#C0C7CE', scrollHover:'#A3ABB4' },
  'rose-ash':       { label:'玫瑰灰',   bg:'#F4EEEC', surface:'#EBE2DE', accent:'#C4A0A0', accentHover:'#B38B8B', secondary:'#A8B5A0', secondaryHover:'#96A48E', text:'#3D3735', textMuted:'#8E807C', border:'#DDD0CB', overlay:'#1a1a1a', scrollThumb:'#C8BAB5', scrollHover:'#B0A09B' },
  'almond-cream':   { label:'暖杏仁',   bg:'#F6F1E8', surface:'#EDE6DA', accent:'#C4A882', accentHover:'#B69870', secondary:'#B0B8A0', secondaryHover:'#9EA88E', text:'#4A4238', textMuted:'#968878', border:'#DED6C8', overlay:'#1a1a1a', scrollThumb:'#C8C0B2', scrollHover:'#B0A898' },
  'sakura':         { label:'樱花粉',   bg:'#F5EEF0', surface:'#EDE2E5', accent:'#C4A0A8', accentHover:'#B38E98', secondary:'#A8B5A0', secondaryHover:'#96A48E', text:'#3D3538', textMuted:'#8E7E82', border:'#DDD0D4', overlay:'#1a1a1a', scrollThumb:'#C8BABE', scrollHover:'#B0A2A6' },
  'lavender-mist':  { label:'薰衣雾',   bg:'#F2F0F5', surface:'#E7E4ED', accent:'#B0A4C0', accentHover:'#9E92B0', secondary:'#A0B0A8', secondaryHover:'#8E9E96', text:'#3C3A3F', textMuted:'#8E8B93', border:'#D8D4DE', overlay:'#1a1a1a', scrollThumb:'#C4BFCE', scrollHover:'#ADA7B8' },
};
/* 主应用当前主题（服务端注入）；直接打开本地文件时回退默认 */
let CURRENT_THEME = "__ANIBOX_THEME__";
try{ const saved = localStorage.getItem("anibox-web-theme"); if(saved && THEMES[saved]) CURRENT_THEME = saved; }catch(e){}
if(!THEMES[CURRENT_THEME]) CURRENT_THEME = "warm-oat";
function applyTheme(name){
  const t = THEMES[name]; if(!t) return;
  CURRENT_THEME = name;
  const r = document.documentElement.style;
  r.setProperty("--bg", t.bg); r.setProperty("--surface", t.surface);
  r.setProperty("--surface2", t.border); r.setProperty("--border", t.border);
  r.setProperty("--text", t.text); r.setProperty("--muted", t.textMuted);
  r.setProperty("--accent", t.accent); r.setProperty("--accent-hover", t.accentHover);
  r.setProperty("--accent2", t.secondary); r.setProperty("--overlay", t.overlay);
  r.setProperty("--scroll-thumb", t.scrollThumb); r.setProperty("--scroll-hover", t.scrollHover);
  const onAccent = ["#9CAF88","#8EACBF","#B0A4C0","#A0B0A8","#C4A882","#B0B8A0","#A8B5A0","#A0B0A8","#B0A4C0"].includes(t.accent) ? "#1f241c" : "#2a2118";
  r.setProperty("--on-accent", onAccent);
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", t.bg);
  try{ localStorage.setItem("anibox-web-theme", name); }catch(e){}
}
applyTheme(CURRENT_THEME);

/* ---------- 工具 ---------- */
const TOKEN = "__ANIBOX_TOKEN__";
const $ = (s, el=document) => el.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; };

function toast(msg){
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2000);
}
function fmtSec(s){
  if(!isFinite(s)||s<=0) return "0:00";
  s = Math.floor(s);
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  return h>0 ? `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`
             : `${m}:${String(sec).padStart(2,"0")}`;
}
async function api(path, opts={}){
  const sep = path.includes("?") ? "&" : "?";
  const url = path + sep + "key=" + encodeURIComponent(TOKEN);
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 30000);
  try{
    const r = await fetch(url, Object.assign({}, opts, { signal: ctrl.signal }));
    if(!r.ok) throw new Error("HTTP " + r.status);
    const ct = r.headers.get("content-type")||"";
    return ct.includes("json") ? r.json() : r.text();
  } finally { clearTimeout(timer); }
}
function vurl(path){
  const sep = path.includes("?") ? "&" : "?";
  return path + sep + "key=" + encodeURIComponent(TOKEN);
}
function fmtSize(n){
  if(!n) return "";
  if(n > 1024*1024*1024) return (n/1024/1024/1024).toFixed(1)+"G";
  if(n > 1024*1024) return Math.round(n/1024/1024)+"M";
  return Math.round(n/1024)+"K";
}

/* ---------- 主题切换器 ---------- */
function themeBtn(){
  const b = el("button","theme-btn","");
  b.title = "切换主题";
  b.addEventListener("click", (e)=>{ e.stopPropagation(); toggleThemePanel(); });
  return b;
}
let themePanel = null;
function toggleThemePanel(){
  if(themePanel){ themePanel.remove(); themePanel = null; return; }
  themePanel = el("div","theme-panel");
  themePanel.appendChild(el("div","tp-t","主题配色"));
  for(const [name, t] of Object.entries(THEMES)){
    const opt = el("button","theme-opt" + (name===CURRENT_THEME ? " active" : ""));
    const sw = el("span","sw");
    const c1 = document.createElement("i"); c1.style.background = t.bg; sw.appendChild(c1);
    const c2 = document.createElement("i"); c2.style.background = t.accent; sw.appendChild(c2);
    const c3 = document.createElement("i"); c3.style.background = t.secondary; sw.appendChild(c3);
    opt.appendChild(sw);
    opt.appendChild(el("span","nm", t.label));
    if(name===CURRENT_THEME) opt.appendChild(el("span","ck","✓"));
    opt.addEventListener("click", (e)=>{
      e.stopPropagation();
      applyTheme(name);
      if(themePanel){ themePanel.remove(); themePanel = null; }
    });
    themePanel.appendChild(opt);
  }
  document.body.appendChild(themePanel);
}
document.addEventListener("click", (e)=>{
  if(themePanel && !themePanel.contains(e.target) && !e.target.classList.contains("theme-btn")){
    themePanel.remove(); themePanel = null;
  }
});

/* ---------- 数据 ---------- */
let LIB = null;
async function loadLib(){
  if(!LIB){
    LIB = await api("/api/library");
    LIB.series.sort((a,b)=> (b.meta?.year||0)-(a.meta?.year||0) || (b.watched?.total||0)-(a.watched?.total||0));
  }
  return LIB;
}

/* ---------- 路由 ---------- */
function route(){
  const h = location.hash || "#/";
  if(h.startsWith("#/series/")) renderDetail(decodeURIComponent(h.slice(9)));
  else if(h.startsWith("#/play")) renderPlayer(h);
  else if(h.startsWith("#/files")) renderFiles(h);
  else renderHome();
}
window.addEventListener("hashchange", route);

/* ---------- 首页 ---------- */
async function renderHome(){
  const app = $("#app"); app.innerHTML = "";
  const hd = el("div","hd");
  hd.appendChild(el("span","ttl","AniBox 串流"));
  const sc = el("div","search");
  sc.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>';
  const inp = el("input"); inp.placeholder="搜索番剧…"; sc.appendChild(inp);
  hd.appendChild(sc);
  hd.appendChild(themeBtn());
  app.appendChild(hd);
  const tabs = el("div","tabs");
  const tabLib = el("button","tab on","番剧库"); tabLib.addEventListener("click", ()=>location.hash="#/");
  const tabFiles = el("button","tab","文件夹"); tabFiles.addEventListener("click", ()=>location.hash="#/files");
  tabs.appendChild(tabLib); tabs.appendChild(tabFiles);
  app.appendChild(tabs);
  const list = el("div","grid");
  app.appendChild(list);
  let kw = "";
  inp.addEventListener("input", ()=>{ kw = inp.value.trim().toLowerCase(); paint(); });

  async function paint(){
    let lib;
    try{ lib = await loadLib(); }catch(e){ list.innerHTML=""; list.appendChild(el("div","empty","无法连接 AniBox 服务，请确认电脑端已开启串流")); return; }
    list.innerHTML = "";
    const items = lib.series.filter(s => !kw || (s.title||"").toLowerCase().includes(kw));
    if(!items.length){ list.appendChild(el("div","empty", kw ? "没有匹配的番剧" : "库是空的，先在电脑端扫描番剧，或到「文件夹」里直接浏览播放")); return; }
    for(const s of items){
      const card = el("div","card");
      card.addEventListener("click", ()=> location.hash = "#/series/" + encodeURIComponent(s.id));
      const cov = el("div","cov");
      const ph = el("div","ph","🎞"); cov.appendChild(ph);
      const img = document.createElement("img");
      img.alt = "";
      const tryRemote = ()=>{ if(s.coverUrl){ img.src = s.coverUrl; img.onerror = ()=>{}; } };
      if(s.coverPath){ img.src = vurl("/api/cover?path=" + encodeURIComponent(s.coverPath)); img.onerror = tryRemote; }
      else if(s.coverUrl){ img.src = s.coverUrl; }
      cov.appendChild(img);
      const w = s.watched, total = w?.total||0, done = w?.watched||0;
      if(total>0){
        const prog = el("div","prog");
        const bar = el("i"); bar.style.width = Math.min(100, Math.round(done/total*100)) + "%"; prog.appendChild(bar);
        cov.appendChild(prog);
      }
      card.appendChild(cov);
      const info = el("div","info");
      info.appendChild(el("div","name", s.title || "未命名"));
      const meta = el("div","meta");
      if(s.meta?.year) meta.appendChild(el("span","tag", String(s.meta.year)));
      meta.appendChild(el("span","tag", `${done}/${total} 集`));
      info.appendChild(meta);
      card.appendChild(info);
      list.appendChild(card);
    }
  }
  paint();
}

/* ---------- 文件夹浏览 ---------- */
async function renderFiles(hash){
  const q = new URLSearchParams((hash||"").split("?")[1]||"");
  const dir = q.get("dir")||"";
  const app = $("#app"); app.innerHTML = "";
  const hd = el("div","hd");
  const back = el("button","back","‹");
  back.addEventListener("click", ()=> dir ? location.hash="#/files" : location.hash="#/");
  hd.appendChild(back);
  hd.appendChild(el("span","ttl", dir ? "文件夹" : "文件夹浏览"));
  const addBtn = el("button","btn-add","＋ 添加");
  addBtn.addEventListener("click", requestAddFolder);
  hd.appendChild(addBtn);
  hd.appendChild(themeBtn());
  app.appendChild(hd);

  let roots = [];
  async function loadRoots(){
    try{
      const r = await api("/api/roots");
      roots = (r||[]).filter(x=>x.exists);
    }catch(e){ roots = []; }
  }
  if(!dir) await loadRoots();

  const list = el("div",""); list.id="flist";
  app.appendChild(list);

  if(!dir && !roots.length){
    list.appendChild(el("div","empty","还没有可浏览的文件夹。\n点右上角「添加」，在电脑上选择一个文件夹后即可浏览播放。"));
  } else if(!dir){
    for(const r of roots){
      const row = el("div","fdir");
      row.addEventListener("click", ()=> location.hash = "#/files?dir=" + encodeURIComponent(r.path));
      row.appendChild(el("span","ic","📁"));
      const nmWrap = el("div","", "");
      nmWrap.style.cssText = "flex:1;min-width:0";
      nmWrap.appendChild(el("div","nm", r.name));
      nmWrap.appendChild(el("div","sub", r.path));
      row.appendChild(nmWrap);
      list.appendChild(row);
    }
  } else {
    // dir 模式：请求目录内容
    let data;
    try{ data = await api("/api/browse?dir=" + encodeURIComponent(dir)); }
    catch(e){
      if(String(e.message).includes("403")){ location.hash = "#/files"; return; }
      list.appendChild(el("div","empty","读取目录失败：" + e.message)); return;
    }
    if(data.parent){
      const up = el("div","fdir up");
      up.addEventListener("click", ()=> location.hash = "#/files?dir=" + encodeURIComponent(data.parent));
      up.appendChild(el("span","ic","⬆"));
      up.appendChild(el("div","nm","上级目录"));
      list.appendChild(up);
    }
    const crumb = el("div","crumb", dir);
    list.appendChild(crumb);
    if(!data.dirs.length && !data.files.length){
      list.appendChild(el("div","empty","此文件夹没有子目录或视频文件"));
    }
    for(const d of data.dirs){
      const row = el("div","fdir");
      row.addEventListener("click", ()=> location.hash = "#/files?dir=" + encodeURIComponent(d.path));
      row.appendChild(el("span","ic","📁"));
      row.appendChild(el("div","nm", d.name));
      row.appendChild(el("span","sub","目录"));
      list.appendChild(row);
    }
    for(const f of data.files){
      const row = el("div","fdir");
      row.addEventListener("click", ()=> location.hash = "#/play?p=" + encodeURIComponent(f.path) + "&dir=" + encodeURIComponent(dir));
      row.appendChild(el("span","ic","🎬"));
      row.appendChild(el("div","nm", f.name));
      row.appendChild(el("span","sub", fmtSize(f.size)));
      list.appendChild(row);
    }
  }
}

/* 在电脑上添加文件夹：弹桌面目录选择 → 完成后自动刷新 */
let addingFolder = false;
async function requestAddFolder(){
  if(addingFolder) return;
  addingFolder = true;
  try{
    await api("/api/request-folder");
    toast("请在电脑上选择文件夹，完成后自动刷新");
    const before = new Set((await safeRoots()).map(r=>r.path));
    // 轮询等新根目录出现（最多 60s）
    for(let i=0;i<20;i++){
      await new Promise(r=>setTimeout(r, 3000));
      const cur = await safeRoots();
      const added = cur.find(r=>!before.has(r.path));
      if(added){ toast("已添加：" + (added.name||added.path)); break; }
    }
    if(location.hash.startsWith("#/files")) route();
  }catch(e){
    toast("请求失败：" + e.message);
  } finally {
    addingFolder = false;
  }
}
async function safeRoots(){
  try{ return await api("/api/roots"); }catch(e){ return []; }
}

/* ---------- 播放器 ---------- */
let cur = { ep:null, subs:[], streamMode:"auto", state:"idle", srcKind:"" };
function renderPlayer(hash){
  const q = new URLSearchParams(hash.split("?")[1]||"");
  const path = q.get("p")||"";
  const seriesId = q.get("id")||"";
  const epNo = Number(q.get("ep"))||0;
  const dir = q.get("dir")||""; // 文件夹浏览模式
  if(!path){ location.hash = "#/"; return; }
  const app = $("#app"); app.innerHTML = "";
  const wrap = el("div","player-wrap");
  const video = document.createElement("video");
  video.playsInline = true; video.setAttribute("webkit-playsinline","");
  video.autoplay = true;
  video.controls = false; video.preload = "auto";
  wrap.appendChild(video);
  // 返回按钮（沉浸式播放时的唯一导航）
  const backBtn = el("button","pl-back","‹ 返回");
  backBtn.addEventListener("click", ()=>{
    if(dir) location.hash = "#/files?dir=" + encodeURIComponent(dir);
    else if(seriesId) location.hash = "#/series/" + encodeURIComponent(seriesId);
    else location.hash = "#/";
  });
  wrap.appendChild(backBtn);
  // 内置诊断条（排查 iPad 黑屏用）
  const dbg = el("div","dbg","");
  wrap.appendChild(dbg);
  const dbgEvents = [];
  function dbgLog(ev){
    dbgEvents.push(ev);
    if(dbgEvents.length > 4) dbgEvents.shift();
    const srcKind = cur ? cur.srcKind : "";
    const err = video.error ? video.error.code + (video.error.message ? ":" + video.error.message : "") : "-";
    dbg.textContent = "[" + srcKind + "] state:" + video.readyState + " net:" + video.networkState +
      " err:" + err + " t:" + (video.currentTime||0).toFixed(1) + "/" + (video.duration||0).toFixed(1) +
      " ev:" + dbgEvents.join(",");
  }
  for(const ev of ["loadedmetadata","loadeddata","play","playing","pause","waiting","stalled","canplay","canplaythrough","error","emptied","abort","ended"]){
    video.addEventListener(ev, ()=> dbgLog(ev));
  }
  video.addEventListener("timeupdate", ()=> dbgLog("t"));
  dbgLog("init");

  /* ---------- 控制条 ---------- */
  const bar = el("div","pbar");
  // 进度条行
  const seekRow = el("div","seek-row");
  const curTime = el("span","t","0:00");
  const durTime = el("span","t","0:00");
  const seek = document.createElement("input");
  seek.type = "range"; seek.min = 0; seek.max = 0; seek.step = 0.1; seek.value = 0;
  seekRow.append(curTime, seek, durTime);
  // 按钮行
  const btnRow = el("div","btn-row");
  const mkBtn = (html, cls, fn) => { const b = el("button", cls, ""); b.innerHTML = html; b.addEventListener("click", fn); return b; };
  const PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>';
  const PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
  const playBtn = el("button","pbtn",PLAY_SVG);
  const updatePlayIcon = ()=>{ playBtn.innerHTML = video.paused ? PLAY_SVG : PAUSE_SVG; };
  video.addEventListener("play", updatePlayIcon);
  video.addEventListener("pause", updatePlayIcon);
  const prevBtn = mkBtn('‹', "", ()=> stepEp(-1));
  const nextBtn = mkBtn('›', "", ()=> stepEp(1));
  const speedBtn = el("button","speed","1.0x"); speedBtn.addEventListener("click", ()=>{
    const opts = [0.5,0.75,1,1.25,1.5,2]; const i = opts.indexOf(video.playbackRate);
    const v = i>=0 ? opts[(i+1)%opts.length] : 1; video.playbackRate = v; speedBtn.textContent = v+"x";
    localStorage.setItem("anibox_speed", String(v));
  });
  const subBtn = mkBtn('字', "", ()=> toggleSubs());
  const autoBtn = el("button","lbl","连播");
  const setAuto = (on)=>{ autoBtn.textContent = on ? "连播·开" : "连播·关"; autoBtn.classList.toggle("on", on); };
  autoBtn.addEventListener("click", ()=>{ const on = !(localStorage.getItem("anibox_autonext") !== "0"); setAuto(!on); localStorage.setItem("anibox_autonext", !on ? "1":"0"); });
  // 音量
  const volBtn = mkBtn(VOL_SVG(false), "", ()=>{
    video.muted = !video.muted;
    if(!video.muted) video.volume = volSlider.value > 0 ? Number(volSlider.value) : 0.8;
    syncVolUI();
  });
  const volSlider = document.createElement("input");
  volSlider.type = "range"; volSlider.className = "vol"; volSlider.min = 0; volSlider.max = 1; volSlider.step = 0.05;
  const savedVol = parseFloat(localStorage.getItem("anibox_volume")||"0.8");
  volSlider.value = isFinite(savedVol) ? savedVol : 0.8;
  video.volume = Number(volSlider.value) || 0.8;
  volSlider.addEventListener("input", ()=>{ video.muted = false; video.volume = Number(volSlider.value); syncVolUI(); });
  volSlider.addEventListener("change", ()=>{ localStorage.setItem("anibox_volume", String(volSlider.value)); });
  function VOL_SVG(muted){
    return muted
      ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/><line x1="16" y1="9" x2="21" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="21" y1="9" x2="16" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
      : '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16.5 8.5a5 5 0 010 7"/><path d="M19 6a8.5 8.5 0 010 12"/></svg>';
  }
  function syncVolUI(){
    volBtn.innerHTML = VOL_SVG(video.muted || video.volume === 0);
    if(!video.muted && Number(volSlider.value) !== video.volume) volSlider.value = String(video.volume);
  }
  // 全屏
  const fsBtn = mkBtn('<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>', "", toggleFullscreen);
  function toggleFullscreen(){
    const doc = document;
    if(!doc.fullscreenElement){
      const req = doc.documentElement.requestFullscreen || doc.documentElement.webkitRequestFullscreen;
      if(req){
        req.call(doc.documentElement).catch(()=>{
          // iOS Safari：video 原生全屏兜底
          try{ if(video.webkitEnterFullscreen) video.webkitEnterFullscreen(); }catch(e){}
        });
      } else {
        try{ if(video.webkitEnterFullscreen) video.webkitEnterFullscreen(); }catch(e){ toast("当前浏览器不支持全屏"); }
      }
    } else {
      (doc.exitFullscreen || doc.webkitExitFullscreen || function(){}).call(doc);
    }
  }
  btnRow.append(playBtn, prevBtn, speedBtn, subBtn, autoBtn, nextBtn, el("span","grow"), volBtn, volSlider, fsBtn);
  bar.appendChild(seekRow);
  bar.appendChild(btnRow);
  wrap.appendChild(bar);
  app.appendChild(wrap);

  /* 进度条交互 */
  let seeking = false;
  seek.addEventListener("pointerdown", ()=>{ seeking = true; });
  seek.addEventListener("input", ()=>{
    if(!isFinite(video.duration) || !video.duration) return;
    curTime.textContent = fmtSec(Number(seek.value));
  });
  seek.addEventListener("change", ()=>{
    if(isFinite(video.duration) && video.duration){
      video.currentTime = Number(seek.value);
    }
    seeking = false;
  });
  video.addEventListener("timeupdate", ()=>{
    if(seeking) return;
    if(isFinite(video.duration) && video.duration){
      seek.max = String(video.duration);
      seek.value = String(video.currentTime);
      curTime.textContent = fmtSec(video.currentTime);
      durTime.textContent = fmtSec(video.duration);
    }
  });
  video.addEventListener("loadedmetadata", ()=>{
    if(isFinite(video.duration) && video.duration){
      seek.max = String(video.duration);
      durTime.textContent = fmtSec(video.duration);
    }
  });

  /* 点击画面切换播放/暂停；双击全屏 */
  let tapLayer = null;
  let lastTap = 0;
  function tryPlay(){
    const p = video.play();
    if(p && p.catch){
      p.catch(()=>{
        if(!tapLayer){
          tapLayer = el("div","tap-play","▶ 点击播放");
          tapLayer.addEventListener("click", ()=>{
            video.muted = false;
            video.play().catch(()=>{});
            if(tapLayer){ tapLayer.remove(); tapLayer = null; }
          });
          wrap.appendChild(tapLayer);
        }
      });
    }
  }
  function hideTapLayer(){ if(tapLayer){ tapLayer.remove(); tapLayer = null; } }
  video.addEventListener("click", ()=>{
    hideTapLayer();
    const now = Date.now();
    if(now - lastTap < 300){ lastTap = 0; toggleFullscreen(); return; }
    lastTap = now;
    if(video.paused){ tryPlay(); } else { video.pause(); }
  });

  const ov = el("div","ov","");
  ov.appendChild(el("div","ring"));
  const pt = el("div","pt","准备播放…"); ov.appendChild(pt);
  const pd = el("div","pd",""); ov.appendChild(pd);
  wrap.appendChild(ov);

  // 初始音量/倍速/连播恢复
  const resume = localStorage.getItem("anibox_speed");
  if(resume){ const r = parseFloat(resume); if(r) video.playbackRate = r; speedBtn.textContent = r+"x"; }
  setAuto(localStorage.getItem("anibox_autonext") !== "0");
  syncVolUI();

  /* 剧集列表：库模式按系列，文件夹模式按目录内视频 */
  let epList = [];
  async function loadEpList(){
    try{
      if(dir){
        const d = await api("/api/browse?dir=" + encodeURIComponent(dir));
        epList = (d.files||[]).map((f,i)=>({ filePath:f.path, epNumber:i+1, fileName:f.name }));
      } else {
        const lib = await loadLib();
        epList = (lib.episodes[seriesId]||[]).slice().sort((a,b)=>a.epNumber-b.epNumber);
      }
    }catch(e){ /* ok */ }
  }
  loadEpList();

  function epUrl(n){
    if(dir) return "#/play?p=" + encodeURIComponent(n.filePath) + "&dir=" + encodeURIComponent(dir);
    return "#/play?p=" + encodeURIComponent(n.filePath) + "&id=" + encodeURIComponent(seriesId) + "&ep=" + n.epNumber;
  }
  function stepEp(d){
    const i = epList.findIndex(e=>e.filePath===path || e.epNumber===epNo);
    const n = epList[i+d];
    if(n) location.hash = epUrl(n);
    else toast(d>0 ? "已经是最后一个视频" : "已经是第一个视频");
  }

  /* 播放主流程 */
  async function start(){
    const ext = (path.split('.').pop()||"").toLowerCase();
    const directExts = ['mp4','m4v','mov','webm','ogv','ogg','3gp'];
    if(directExts.includes(ext)){
      playPath(path, "direct");
      return;
    }
    startStreamPipeline("auto");
  }

  async function startStreamPipeline(mode){
    ov.classList.remove("hidden");
    pt.textContent = "分析文件…"; pd.textContent = "";
    try{
      const r = await api("/api/stream?path=" + encodeURIComponent(path) + "&mode=" + encodeURIComponent(mode));
      cur.streamMode = r.mode || mode;
      if(r.kind === "error"){ showErr(r.message || "无法播放该文件"); return; }
      if(r.kind === "working"){
        pt.textContent = r.mode === "transcode" ? "正在转码（编码不兼容，首次较慢）…" : "正在转封装…";
        pd.textContent = r.progress>0 ? Math.round(r.progress*100)+"%" : "首次播放需要几秒到几十秒，之后秒开";
        await pollStream();
      } else {
        playPath(r.path, "stream");
      }
    }catch(e){ showErr("请求失败: " + e.message); }
  }

  function showErr(msg){
    ov.innerHTML = "";
    ov.appendChild(el("div","err", msg));
    const back = el("button","","返回列表"); back.style.cssText="margin-top:14px;background:var(--accent);color:var(--on-accent);padding:9px 22px;border-radius:20px;font-size:13px";
    back.addEventListener("click", ()=> backBtn.click());
    ov.appendChild(back);
  }

  async function pollStream(){
    const mode = cur.streamMode || "auto";
    for(let i=0;i<900;i++){
      await new Promise(r=>setTimeout(r, 1200));
      try{
        const st = await api("/api/stream-status?path=" + encodeURIComponent(path) + "&mode=" + encodeURIComponent(mode));
        if(st.state === "done" && st.cachePath){ playPath(st.cachePath, "stream"); return; }
        if(st.state === "error"){ showErr(st.error || "转码失败"); return; }
        if(st.progress>0){ pd.textContent = "正在转码 " + Math.round(st.progress*100) + "%（首次较慢，之后秒开）"; }
        else pd.textContent = "正在处理…";
      }catch(e){ /* 网络抖动重试 */ }
    }
    showErr("处理超时，请重试");
  }

  let usingTranscode = false;
  function prewarmNext(){
    if(!epList.length || cur.prewarmed) return;
    const i = epList.findIndex(e=>e.filePath===path);
    const n = epList[i+1];
    if(!n) return;
    cur.prewarmed = true;
    setTimeout(()=>{
      api("/api/stream?path=" + encodeURIComponent(n.filePath) + "&mode=auto").catch(()=>{});
    }, 4000);
  }
  function playPath(p, srcKind){
    cur.srcKind = srcKind || "stream";
    ov.classList.remove("hidden");
    pt.textContent = "加载视频…"; pd.textContent = "";
    const src = vurl("/api/video?path=" + encodeURIComponent(p));
    video.src = src;
    video.load();
    tryPlay();
  }

  video.addEventListener("error", ()=>{
    const err = video.error;
    const info = err ? `（code=${err.code}${err.message ? " · " + err.message : ""}）` : "";
    if(cur.srcKind === "direct"){
      cur.srcKind = "stream";
      startStreamPipeline("auto");
    } else if(!usingTranscode){
      usingTranscode = true; cur.streamMode = "transcode";
      startStreamPipeline("transcode");
    } else {
      showErr("该视频无法在浏览器中播放（可能是编码不兼容）" + info);
    }
  });

  video.addEventListener("loadedmetadata", async ()=>{
    ov.classList.add("hidden");
    tryPlay();
    prewarmNext();
    try{
      const p = await api("/api/progress?path=" + encodeURIComponent(path));
      if(p && p.position > 5 && p.position < video.duration - 10){
        video.currentTime = p.position;
      }
    }catch(e){ /* ok */ }
    loadSubs();
  });
  video.addEventListener("play", ()=>{ ov.classList.add("hidden"); });
  video.addEventListener("pause", ()=> saveProgress());
  video.addEventListener("ended", ()=>{
    saveProgress(true);
    if(localStorage.getItem("anibox_autonext") !== "0") stepEp(1);
  });
  setInterval(saveProgress, 5000);
  window.addEventListener("beforeunload", saveProgress);
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden) saveProgress(); });

  let savedFor = "";
  async function saveProgress(force){
    const p = path; if(!p || p===savedFor && !force) return;
    savedFor = p;
    try{ await api("/api/progress", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ path: p, position: video.currentTime||0 }) }); }catch(e){}
  }

  /* 字幕 */
  let subOn = true;
  async function loadSubs(){
    try{
      const subs = await api("/api/subs?path=" + encodeURIComponent(path));
      cur.subs = subs;
      if(!subs.length) return;
      const t = document.createElement("track");
      t.kind = "subtitles"; t.label = subs[0].label || "字幕"; t.srclang = subs[0].language || "zh";
      t.src = vurl("/api/sub?path=" + encodeURIComponent(subs[0].filePath));
      video.appendChild(t);
      subBtn.classList.add("on");
    }catch(e){ /* 无字幕 */ }
  }
  function toggleSubs(){
    subOn = !subOn;
    const t = video.querySelector("track");
    if(!t){ toast("该集没有外挂字幕"); subOn = true; return; }
    t.track.mode = subOn ? "showing" : "hidden";
    subBtn.classList.toggle("on", subOn);
  }

  start();
}

/* ---------- 启动 ---------- */
route();
</script>
</body>
</html>
