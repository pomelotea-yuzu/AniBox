version: "1.0"
name: anibox-ci
displayName: AniBox CI
stages:
  - name: check
    displayName: 检查
    strategy: naturally
    trigger: auto
    steps:
      - step: shell@latest
        name: ""
        displayName: 安装 Node + 类型检查 + 代码检查
        commands:
          - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          - apt-get install -y nodejs
          - npm ci --ignore-scripts
          - npm run typecheck
          - npm run lint
        strategy:
          retry: "0"
  - name: test
    displayName: 测试
    strategy: naturally
    trigger: auto
    steps:
      - step: shell@latest
        name: ""
        displayName: 安装 Node + 单元测试
        commands:
          - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          - apt-get install -y nodejs
          - npm ci --ignore-scripts
          - npm test
        strategy:
          retry: "0"
triggers:
  trigger: push
  branches:
    include:
      - main
    exclude:
      - ""
notify: []
strategy:
  blocking: true
