version: "1.0"
name: anibox-ci
displayName: AniBox CI
stages:
  - name: check
    displayName: 检查
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: ""
        displayName: 类型检查 + 代码检查
        nodeVersion: 14.16.0
        commands:
          - export NVM_DIR="$HOME/.nvm" && [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          - nvm install 22 && nvm use 22
          - npm ci --ignore-scripts
          - npm run typecheck
          - npm run lint
        strategy:
          retry: "0"
  - name: test
    displayName: 测试
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: ""
        displayName: 单元测试
        nodeVersion: 14.16.0
        commands:
          - export NVM_DIR="$HOME/.nvm" && [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          - nvm install 22 && nvm use 22
          - npm ci --ignore-scripts
          - npm test
        strategy:
          retry: "0"
triggers:
  trigger: push
  branches:
    include:
      - main
    exclude:
      - ""
notify: []
strategy:
  blocking: true
