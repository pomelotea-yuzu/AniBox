version: "1.0"
name: anibox-ci
displayName: AniBox CI
stages:
  - name: check
    displayName: 检查
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: ""
        displayName: 全量检查
        nodeVersion: 14.16.0
        commands:
          - node --version
          - npm --version
          - npm ci --ignore-scripts
          - npm run typecheck
          - npm run lint
          - npm test
        strategy:
          retry: "0"
triggers:
  trigger: push
  branches:
    include:
      - main
    exclude:
      - ""
notify: []
strategy:
  blocking: true
