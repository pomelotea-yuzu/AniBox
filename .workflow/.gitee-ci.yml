version: "1.0"
name: anibox-ci
displayName: AniBox CI
stages:
- name: 构建
  displayName: 构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: ""
    displayName: Nodejs 构建
    nodeVersion: 14.16.0
    commands:
    - node --version
    - npm --version
    - npm ci --ignore-scripts
    - npm run typecheck
    - npm run lint
    - npm test
    caches:
    - "~/.npm"
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true
