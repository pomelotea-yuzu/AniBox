displayName: AniBox CI
image: node:22

stages:
  - displayName: 安装与检查
    steps:
      - displayName: 安装依赖
        step: node@latest
        commands:
          - npm ci --ignore-scripts
      - displayName: 类型检查
        step: node@latest
        commands:
          - npm run typecheck
      - displayName: 代码检查
        step: node@latest
        commands:
          - npm run lint
  - displayName: 测试
    steps:
      - displayName: 单元测试
        step: node@latest
        commands:
          - npm test
